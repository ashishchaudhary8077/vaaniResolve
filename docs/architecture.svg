<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 720" font-family="Inter, system-ui, sans-serif">
  <rect width="920" height="720" fill="#0b1220"/>
  <text x="40" y="44" fill="#e2e8f0" font-size="22" font-weight="700">VaaniResolve — Talk. Interrupt. Resolve.</text>

  <!-- User -->
  <g>
    <rect x="40" y="76" width="200" height="66" rx="14" fill="#1e293b" stroke="#475569"/>
    <text x="140" y="104" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">User</text>
    <text x="140" y="124" fill="#94a3b8" font-size="11" text-anchor="middle">voice / speech / gestures</text>
  </g>

  <!-- STT -->
  <g>
    <rect x="330" y="76" width="220" height="66" rx="14" fill="#1e293b" stroke="#475569"/>
    <text x="440" y="104" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">STT (Web Speech API)</text>
    <text x="440" y="124" fill="#94a3b8" font-size="11" text-anchor="middle">transcript + T0 speech-end time</text>
  </g>

  <!-- Conversation Manager -->
  <g>
    <rect x="620" y="76" width="260" height="66" rx="14" fill="#312e81" stroke="#6366f1"/>
    <text x="750" y="104" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Conversation Manager</text>
    <text x="750" y="124" fill="#c7d2fe" font-size="11" text-anchor="middle">state machine · session/turn/generation · entity context</text>
  </g>

  <!-- Agent -->
  <g>
    <rect x="330" y="220" width="550" height="66" rx="14" fill="#312e81" stroke="#6366f1"/>
    <text x="605" y="248" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">LLM Agent with structured tool calling</text>
    <text x="605" y="268" fill="#c7d2fe" font-size="11" text-anchor="middle">Claude (tool use) · disclosed deterministic fallback</text>
  </g>

  <!-- Tool Router -->
  <g>
    <rect x="330" y="350" width="550" height="66" rx="14" fill="#1e293b" stroke="#475569"/>
    <text x="605" y="378" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Tool Router → Commerce APIs (mocks w/ latency·failure·timeout·cancel)</text>
    <text x="605" y="398" fill="#94a3b8" font-size="11" text-anchor="middle">orders · track · cancel · return · refund · replacement · delivery · payment · product · warranty</text>
  </g>

  <!-- Speech formatter + Rime -->
  <g>
    <rect x="330" y="480" width="550" height="66" rx="14" fill="#1e293b" stroke="#475569"/>
    <text x="605" y="508" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Speech Formatter → Rime streaming TTS (PCM)</text>
    <text x="605" y="528" fill="#94a3b8" font-size="11" text-anchor="middle">RIME_API_KEY · model=rime-tts · speaker=mist · endpoint=/v1/rSpeech</text>
  </g>

  <!-- Audio controller -->
  <g>
    <rect x="330" y="610" width="240" height="66" rx="14" fill="#1e293b" stroke="#475569"/>
    <text x="450" y="638" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Audio Playback Controller</text>
    <text x="450" y="658" fill="#94a3b8" font-size="11" text-anchor="middle">queue · interrupt() · flushQueue()</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#f87171"/></marker>
  </defs>
  <line x1="240" y1="109" x2="320" y2="109" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="550" y1="109" x2="610" y2="109" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="142" x2="750" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="605" y1="286" x2="605" y2="340" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="605" y1="416" x2="605" y2="470" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="546" x2="450" y2="600" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- interruption path -->
  <g stroke="#f87171" stroke-width="2" fill="none">
    <path d="M60 196 C 60 300, 150 300, 150 416 C 150 540, 320 560, 330 640" marker-end="url(#arrR)"/>
  </g>
  <text x="70" y="470" fill="#f87171" font-size="12" font-weight="600">USER INTERRUPT</text>

  <!-- stale guard badge -->
  <rect x="680" y="560" width="200" height="50" rx="12" fill="#7f1d1d" stroke="#f87171"/>
  <text x="780" y="582" fill="#fecaca" font-size="12" font-weight="700" text-anchor="middle">STALE RESULT GUARD</text>
  <text x="780" y="599" fill="#fca5a5" font-size="10" text-anchor="middle">generation mismatch ⇒ DISCARD, never spoken</text>
  <line x1="750" y1="640" x2="780" y2="616" stroke="#f87171" stroke-width="2" marker-end="url(#arrR)"/>
</svg>